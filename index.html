<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Primary Meta -->
    <title>Ukonnect - AI Performance Marketing</title>
    <meta name="description" content="Ukonnect helps businesses grow with AI-powered performance marketing. Automate campaigns, track conversions, and maximise ROI with intelligent tools built for modern brands." />
    <meta name="keywords" content="AI marketing, performance marketing, marketing automation, conversion tracking, digital advertising, AI campaigns, ROI optimisation, Ukonnect" />
    <meta name="author" content="Ukonnect" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ukonnect.pt" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ukonnect.pt" />
    <meta property="og:title" content="Ukonnect - AI Performance Marketing" />
    <meta property="og:description" content="Grow faster with AI-powered marketing automation. Ukonnect automates your campaigns, tracks every conversion, and maximises your ROI — all in one platform." />
    <meta property="og:image" content="https://ukonnect.pt/favicon.png" />
    <meta property="og:site_name" content="Ukonnect" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ukonnect - AI Performance Marketing" />
    <meta name="twitter:description" content="Grow faster with AI-powered marketing automation. Automate campaigns, track conversions, and maximise ROI with Ukonnect." />
    <meta name="twitter:image" content="https://ukonnect.pt/favicon.png" />

    <!-- Schema.org Organisation (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Ukonnect",
      "url": "https://ukonnect.pt",
      "logo": "https://ukonnect.pt/favicon.png",
      "description": "AI-powered performance marketing platform that automates campaigns, tracks conversions, and maximises ROI for modern brands.",
      "sameAs": []
    }
    </script>

    <!-- DNS prefetch for third-party services -->
    <link rel="dns-prefetch" href="https://app.cal.com">
    <link rel="dns-prefetch" href="https://api.emailjs.com">
  </head>
  <body class="font-sans antialiased text-slate-800 bg-[#FAFAFC] selection:bg-indigo-500/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
